name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentos

jobs:
  server:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agentos/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Windows TCP port diagnostics
        shell: pwsh
        run: |
          netsh interface ipv4 show excludedportrange protocol=tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh interface ipv4 show dynamicport tcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Server tests
        run: node scripts/capture-lite-verification.mjs server-tests -- pwsh -NoProfile -Command 'pnpm --filter @agentos/server test; exit $LASTEXITCODE'

      - name: Web tests
        run: node scripts/capture-lite-verification.mjs web-tests -- pwsh -NoProfile -Command 'pnpm --filter @agentos/web test; exit $LASTEXITCODE'

      - name: P4 acceptance receipt contract tests
        run: node --test --test-reporter=tap scripts/validate-existing-project-acceptance.test.mjs

      - name: Validate P4 acceptance manifest without claiming a run
        run: node scripts/validate-existing-project-acceptance.mjs --check-manifest

      - name: Lite scope and evidence gates
        run: |
          node scripts/capture-lite-verification.mjs lite-regressions -- node --test --test-reporter=tap scripts/verify-lite-scope.test.mjs scripts/verify-lite-acceptance.test.mjs scripts/run-lite-verification-batches.test.mjs scripts/capture-lite-verification.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/capture-lite-verification.mjs lite-scope -- node scripts/verify-lite-scope.mjs

      - name: Shared M3 contract harness
        run: node scripts/capture-lite-verification.mjs shared-m3 apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/m3-runtime.test.ts

      - name: Shared P6-L1C-M1 contract harness
        run: node scripts/capture-lite-verification.mjs shared-p6 apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/p6-l1c-git-observation-contract.test.ts ../../packages/shared/p6-l1c-porcelain-v2.test.ts

      - name: Shared MF-0 memory contract harness
        run: node scripts/capture-lite-verification.mjs shared-mf0 apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/mf0-memory-contracts.test.ts

      - name: Shared MF-5 memory event harness
        run: node scripts/capture-lite-verification.mjs shared-mf5-memory apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/mf5-memory-events.test.ts

      - name: Shared MF-5 Workspace event harness
        run: node scripts/capture-lite-verification.mjs shared-mf5-workspace apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/mf5-workspace-events.test.ts

      - name: Shared CR-0 conversation contract harness
        run: node scripts/capture-lite-verification.mjs shared-cr0 apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/cr0-conversation-contracts.test.ts

      - name: Shared workflow template harness
        run: node scripts/capture-lite-verification.mjs shared-wf-templates apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/wf-templates.test.ts

      - name: Shared workflow template instantiation harness
        run: node scripts/capture-lite-verification.mjs shared-wf-instantiation apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/wf-template-instantiation.test.ts

      - name: Shared complete contract harness
        run: node scripts/capture-lite-verification.mjs shared-complete apps/server -- node --import tsx --test --test-reporter=tap ../../packages/shared/*test.ts

      - name: Workspace build
        run: node scripts/capture-lite-verification.mjs workspace-build -- pwsh -NoProfile -Command 'pnpm build; exit $LASTEXITCODE'

      - name: Preserve raw verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-verification-${{ github.sha }}
          path: agentos/logs/pass-audit/
          if-no-files-found: error

  p4-core:
    runs-on: windows-latest
    env:
      P4_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agentos/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core workspace dependencies
        shell: pwsh
        run: |
          pnpm --filter @agentos/shared build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @agentos/process-runtime build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Core tests (simulated provider)
        run: node scripts/run-p4-ci-gate.mjs agent-core --mode simulated-provider -- pwsh -NoProfile -Command 'pnpm --filter @agentos/agent-core test; exit $LASTEXITCODE'

      - name: Preserve P4 Core receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentos/logs/p4-ci-gates/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/agent-core/
          if-no-files-found: error

  p4-process-runtime:
    runs-on: windows-latest
    env:
      P4_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agentos/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process Runtime tests (real Windows process)
        run: node scripts/run-p4-ci-gate.mjs process-runtime --mode real-windows-process -- pwsh -NoProfile -Command 'pnpm --filter @agentos/process-runtime exec vitest run --reporter=verbose; exit $LASTEXITCODE'

      - name: Verify Windows native process test inventory
        run: node scripts/verify-p4-windows-native-inventory.mjs --receipt "logs/p4-ci-gates/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/process-runtime/receipt.json" --expected-sha "${{ github.sha }}"

      - name: Preserve P4 Process Runtime receipt and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-process-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentos/logs/p4-ci-gates/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/process-runtime/
          if-no-files-found: error

  p4-browser:
    runs-on: windows-latest
    env:
      P4_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agentos/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome
        run: pnpm --filter @agentos/web exec playwright install chrome

      - name: Deterministic P4 browser regression
        run: node scripts/run-p4-ci-gate.mjs browser-stable-keys --mode no-provider -- pwsh -NoProfile -Command 'pnpm --filter @agentos/web exec playwright test --config=playwright.config.ts --project=desktop-1280 e2e/p4-release-gates.spec.ts --output=../../logs/p4-ci-gates/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/browser-stable-keys/playwright-results; exit $LASTEXITCODE'

      - name: Preserve P4 browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: agentos/logs/p4-ci-gates/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
