version: "3.9"

services:
  backend:
    build: ./backend
    container_name: collab-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/collab.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - collab_data:/app/data
    networks:
      - collab-net

  frontend:
    build: ./frontend
    container_name: collab-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - collab-net

volumes:
  collab_data:

networks:
  collab-net:
    driver: bridge
